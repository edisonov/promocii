name: Обнови промоции

on:
  schedule:
    - cron: "40 6 * * *"   # всеки ден в 06:40 UTC (08:40 българско време)
  workflow_dispatch:        # позволява ръчно пускане от бутона "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-promos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet "anthropic>=0.40"

      - name: Update data.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/update_promos.py

      - name: Commit if changed
        run: |
          git config user.name "Промоции бот"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "Няма промени в data.json"
          else
            git add data.json
            git commit -m "Авто-обнови промоции $(date -u +%Y-%m-%d)"
            git push
            echo "data.json обновен и качен"
          fi
